# Spoty'yi kurulabilir bir paket yapar.
#
# ASIL AMAC (Windows): "gui-scripts" girisi .venv\Scripts\ icine gercek bir
# spoty.exe uretir. Kisayol pythonw.exe yerine bu exe'yi gosterince Windows
# uygulamayi "Python" degil "Spoty" olarak tanir -> gorev cubugunda kendi
# ikonuyla gruplanir ve sabitlenen (pin) kisayol calisir.
#
# Kurulum (proje kokunden):
#   .\.venv\Scripts\python.exe -m pip install -e .

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spoty"
version = "1.0.5"
description = "Kisisel masaustu muzik uygulamasi (yt-dlp + pywebview)"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp",
    "just_playback",
    "mutagen",
    "pillow",
    "pywebview",
    "pythonnet ; sys_platform == 'win32'",
]

[project.gui-scripts]
# gui-scripts (console-scripts DEGIL): konsol penceresi acilmaz
spoty = "spoty.webmain:main"

[tool.setuptools]
packages = ["spoty", "spoty.core"]

[tool.setuptools.package-data]
spoty = ["web/*"]
